<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Workshops | QT Training Admin</title>
  <link rel="icon" href="../assets/logo/favicon-32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>(function(){try{var t=localStorage.getItem('qt-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
</head>
<body class="admin-body">

<aside class="admin-sidebar" data-admin-sidebar>
  <a href="dashboard.html" class="brand">
    <img src="../assets/logo/logo-white.png" alt="QT Training">
    <span class="admin-brand-label">Admin Dashboard</span>
  </a>
  <ul class="admin-nav">
    <li><a href="dashboard.html">Dashboard</a></li>
    <li class="nav-section-label">Content Management</li>
    <li><a href="courses.html">Courses</a></li>
    <li><a href="workshops.html" class="active">Workshops</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="events.html">Events</a></li>
    <li><a href="testimonials.html">Testimonials</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li class="nav-section-label">Management</li>
    <li><a href="enquiries.html">Enquiries</a></li>
    <li><a href="subscribers.html">Subscribers</a></li>
    <li><a href="settings.html">Settings</a></li>
  </ul>
  <div class="admin-sidebar-footer">
    <div class="admin-sidebar-email" data-admin-email></div>
    <button class="btn btn-outline btn-sm" data-logout-btn>Log Out</button>
  </div>
</aside>
<div class="admin-sidebar-backdrop" data-admin-sidebar-backdrop></div>

<main class="admin-main">
  <div class="admin-topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="admin-menu-toggle" data-admin-menu-toggle aria-label="Toggle menu">&#9776;</button>
      <h1>Workshops</h1>
    </div>
    <div class="admin-topbar-actions">
      <span class="admin-topbar-email" data-admin-email></span>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
    </div>
  </div>
  <div class="admin-content">
    <datalist id="workshop-categories">
      <option value="Leading Others">
      <option value="Working Together">
      <option value="Personal Effectiveness">
      <option value="Service Excellence">
    </datalist>

    <div class="admin-card">
      <div class="admin-toolbar">
        <h2>Workplace Power Sessions</h2>
        <button class="btn btn-primary btn-sm" data-add-btn>+ Add Workshop</button>
      </div>

      <form class="admin-form-panel" data-form-panel>
        <input type="hidden" name="id">
        <div class="admin-form-grid">
          <div class="form-field">
            <label>Category</label>
            <input type="text" name="category" list="workshop-categories" required>
          </div>
          <div class="form-field">
            <label>Title</label>
            <input type="text" name="title" required>
          </div>
          <div class="form-field">
            <label>Subtitle</label>
            <input type="text" name="subtitle">
          </div>
          <div class="form-field">
            <label>Sort order</label>
            <input type="number" name="sort_order" value="0">
          </div>
          <div class="form-field full">
            <label>Description</label>
            <textarea name="description" rows="3"></textarea>
          </div>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn btn-primary btn-sm">Save Workshop</button>
          <button type="button" class="btn btn-outline on-light btn-sm" data-cancel-btn>Cancel</button>
        </div>
        <p class="form-status" data-form-status></p>
      </form>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Category</th><th>Title</th><th>Subtitle</th><th></th></tr></thead>
          <tbody data-table-body>
            <tr><td colspan="4"><span class="spinner"></span>Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="../js/theme.js"></script>
<script type="module" src="../js/admin/workshops.js"></script>
</body>
</html>
